{{- if .Values.gateway }}
{{- if .Values.gateway.enabled }}
apiVersion: networking.istio.io/v1
kind: Gateway

metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Values.namespace }}

spec:
  selector:
    istio: ingressgateway

  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP

      hosts:
{{- range .Values.gateway.hosts }}
        - {{ . | quote }}
{{- end }}

{{- end }}
{{- end }}