name: Develop

on:

  push:

    branches:

      - develop

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker

        run: |

          docker build -t frontend:${{ github.sha }} .

      - name: Push Image

        run: |

          docker push frontend:${{ github.sha }}

      - name: Update GitOps Repo

        run: |

          git clone https://github.com/sundeepreddy123/pipelines.git gitops

          cd gitops

          yq -i '.image.tag="${{ github.sha }}"' \
          applications/onlineboutique/values-dev.yaml

          git add .

          git commit -m "Deploy Dev"

          git push